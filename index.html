
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4f7">
    <meta name="description" content="A little anniversary surprise made with love.">

    <title>For My Mayalu ♡</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/countdown.css">
</head>

<body class="page-countdown">
    <main id="app">
        <section class="countdown-screen">
            <div class="countdown-card">
                <span class="eyebrow">A LITTLE SOMETHING FOR YOU</span>

                <div class="countdown-heart">♡</div>

                <h1>Hey, mayalu...</h1>

                <p class="countdown-message">
                    Maile timro lagi sano surprise banako chhu.
                    Tara ali ber parkhinu parchha hai. 🥹
                </p>

                <p class="countdown-label">Your surprise unlocks in</p>

                <div class="countdown-timer" aria-live="polite">
                    <div class="time-unit">
                        <span id="days">00</span>
                        <small>Days</small>
                    </div>

                    <div class="time-unit">
                        <span id="hours">00</span>
                        <small>Hours</small>
                    </div>

                    <div class="time-unit">
                        <span id="minutes">00</span>
                        <small>Minutes</small>
                    </div>

                    <div class="time-unit">
                        <span id="seconds">00</span>
                        <small>Seconds</small>
                    </div>
                </div>

                <p class="countdown-footer">
                    Hamro 6 months ko sano celebration ♡
                </p>

                <p class="timezone-note">
                    Nepal Time · October 20, 2026
                </p>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
